# ============================================================================
# Synthetic Data Generation Config - Fraud Ring Detection
# ============================================================================

synthetic_data:
  # Overall scale
  total_transactions: 50000
  duration_days: 90                          # 3-month period
  start_date: "2025-10-01"
  seed: 42                                   # For reproducibility

  # Account configuration
  accounts:
    normal_account_count: 5000
    merchant_count: 0
    fraudster_account_count: 0               # Will be added via rings

    account_features:
      age_distribution: "lognormal"          # lognormal, uniform, exponential
      kyc_risk_distribution: "beta"          # beta, uniform, normal
      transaction_frequency: "poisson"       # poisson, normal, uniform

  # Transaction configuration
  transactions:
    normal_transaction_ratio: 0.95           # 95% normal, 5% fraud-related
    average_daily_transactions: 556

    channels:
      online: 0.50
      mobile: 0.35
      atm: 0.10
      branch: 0.05

    amounts:
      currency_distribution:
        VND: 0.70
        USD: 0.20
        EUR: 0.10
      amount_distribution: "lognormal"
      amount_mean: 2000
      amount_std: 1200

    # Exchange rates (approximate)
    exchange_rates:
      VND: 25000
      EUR: 0.92
      GBP: 0.79
      USD: 1.0

  # Fraud ring configuration
  fraud_rings:
    total_ring_count: 45                    # Total fraud rings to embed

    ring_distribution:
      small_rings_3person: 15                 # 3-person triangles
      medium_rings_5person: 20                # 5-person cycles
      large_rings_8person: 10                 # 8+ person networks

    ring_characteristics:
      small:
        participant_count: 3
        transactions_per_cycle: 3
        total_amount_min: 15000
        total_amount_max: 50000
        cycles_per_ring_min: 5
        cycles_per_ring_max: 10

      medium:
        participant_count: 5
        transactions_per_cycle: 5
        total_amount_min: 75000
        total_amount_max: 150000
        cycles_per_ring_min: 8
        cycles_per_ring_max: 15

      large:
        participant_count: 8
        transactions_per_cycle_min: 8
        transactions_per_cycle_max: 12
        total_amount_min: 200000
        total_amount_max: 350000
        cycles_per_ring_min: 10
        cycles_per_ring_max: 20

    # Ring types distribution
    ring_types:
      money_laundering: 25
      account_takeover: 12
      collusion: 5
      phishing: 3

    # Time patterns
    activity_patterns:
      inter_transaction_delay_hours_min: 1
      inter_transaction_delay_hours_max: 6
      is_burst_activity: true
      typical_hours: [8, 9, 10, 14, 15, 16]

    # Amount patterns
    amount_patterns:
      escalating: true
      testing_limits: true
      standard_amounts: false

  # Normal distribution parameters
  normal_account_rules:
    account_age_days_min: 30
    account_age_days_max: 2000
    kyc_risk_alpha: 2
    kyc_risk_beta: 8
    daily_limit_options: [10000, 25000, 50000, 100000]
    avg_amount_mean: 1500
    avg_amount_std: 500
    frequency_poisson_lambda: 40

  # Fraudster account rules (more suspicious)
  fraudster_account_rules:
    account_age_days_min: 30
    account_age_days_max: 300
    kyc_risk_alpha: 5
    kyc_risk_beta: 3
    daily_limit_options: [25000, 50000, 100000]
    avg_amount_mean: 8000
    avg_amount_std: 3000
    frequency_poisson_lambda: 20

  # Normal transaction rules
  normal_transaction_rules:
    amount_distribution: "lognormal"
    amount_mean: 1500
    amount_std: 500
    amount_min: 50
    amount_max: 50000
    business_hours_probability: 0.85
    weekday_probability: 0.80
    channels:
      online: 0.50
      mobile: 0.35
      atm: 0.10
      branch: 0.05

  # Location settings (Vietnam focus)
  locations:
    default_country: "Vietnam"
    default_city: "Ho Chi Minh"
    latitude_center: 10.7769
    latitude_std: 0.5
    longitude_center: 106.6963
    longitude_std: 0.5

  # Output paths
  output:
    base_dir: "data/synthetic"
    raw_dir: "data/synthetic/raw"
    processed_dir: "data/synthetic/processed"
    ground_truth_dir: "data/synthetic/ground_truth"

  # Validation settings
  validation:
    enabled: true
    strict_mode: false                       # Stop on first error if true
    checks:
      no_duplicate_ids: true
      valid_amounts: true
      valid_timestamps: true
      fraud_label_consistency: true
      ring_structure_valid: true
