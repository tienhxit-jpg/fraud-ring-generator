# v03 synthetic data configuration
# Key change from v02: a small portion of background traffic is replaced by
# one-way bridges between fraud rings and normal accounts. This preserves the
# background transaction budget and keeps ring SCCs from expanding.

project:
  name: "Fraud Ring Detection via Knowledge Graph - v03"
  version: "3.0"
  seed: 42

synthetic_data:
  seed: 42
  total_transactions: 50000
  duration_days: 90
  start_date: "2025-10-01"
  end_date: "2025-12-31"

  accounts:
    normal_account_count: 5000
    merchant_count: 200
    fraudster_account_count: 0

  transactions:
    normal_transaction_ratio: 0.95
    fraud_transaction_ratio: 0.05
    channels:
      online: 0.50
      mobile: 0.35
      atm: 0.10
      branch: 0.05
    amounts:
      currency_distribution:
        VND: 0.70
        USD: 0.20
        EUR: 0.10
      amount_distribution: lognormal
      amount_mean: 2000
      amount_std: 1200
      amount_min: 50
      amount_max: 100000
    exchange_rates:
      VND_to_USD: 25000
      EUR_to_USD: 1.08
      GBP_to_USD: 1.27

  # One-way bridges make rings participate in external traffic without making
  # the ring and the giant normal SCC mutually reachable.
  background_connectivity:
    enabled: true
    bridges_per_ring: 2
    direction_strategy: alternate_by_ring  # outbound, inbound, alternate_by_ring
    amount_min: 50
    amount_max: 50000
    channels:
      online: 0.50
      mobile: 0.35
      atm: 0.10
      branch: 0.05

  fraud_rings:
    total_ring_count: 45
    ring_distribution:
      small_rings_3person: 15
      medium_rings_5person: 20
      large_rings_8person: 10
    ring_characteristics:
      small:
        participant_count: 3
        transactions_per_cycle: 3
        total_amount_min: 15000
        total_amount_max: 50000
        cycles_per_ring_min: 5
        cycles_per_ring_max: 10
      medium:
        participant_count: 5
        transactions_per_cycle: 5
        total_amount_min: 75000
        total_amount_max: 150000
        cycles_per_ring_min: 8
        cycles_per_ring_max: 15
      large:
        participant_count: 8
        transactions_per_cycle_min: 8
        transactions_per_cycle_max: 12
        total_amount_min: 200000
        total_amount_max: 350000
        cycles_per_ring_min: 10
        cycles_per_ring_max: 20
    ring_types:
      money_laundering: 25
      account_takeover: 12
      collusion: 5
      phishing: 3
    activity_patterns:
      typical_hours: [8, 9, 10, 14, 15, 16]
    amount_patterns:
      escalating: true
      escalation_factor: 1.05

  normal_account_rules:
    account_age_days_min: 30
    account_age_days_max: 2000
    kyc_risk_alpha: 2.0
    kyc_risk_beta: 8.0
    daily_limit_options: [10000, 25000, 50000, 100000]
    avg_amount_mean: 1500
    avg_amount_std: 500
    monthly_transaction_count_lambda: 40

  fraudster_account_rules:
    account_age_days_min: 10
    account_age_days_max: 300
    kyc_risk_alpha: 5.0
    kyc_risk_beta: 3.0
    daily_limit_options: [25000, 50000, 100000]
    avg_amount_mean: 8000
    avg_amount_std: 3000
    monthly_transaction_count_lambda: 20

  normal_transaction_rules:
    amount_distribution: lognormal
    amount_mean: 1500
    amount_std: 500
    amount_min: 50
    amount_max: 50000
    business_hours_probability: 0.85
    weekday_probability: 0.80

  merchants:
    high_risk_merchants: 50

  output:
    base_dir: data/synthetic/v03/d02
    raw_dir: data/synthetic/v03/d02/raw
    processed_dir: data/synthetic/v03/d02/processed
    ground_truth_dir: data/synthetic/v03/d02/ground_truth
    accounts_file: accounts.csv
    merchants_file: merchants.csv
    transactions_file: transactions.csv
    fraud_rings_file: fraud_rings.json

  validation:
    enabled: true
    checks:
      no_duplicate_ids: true
      valid_amounts: true
      valid_timestamps: true
      fraud_label_consistency: true
      ring_structure_valid: true
      distribution_check: true
    expected_fraud_ratio: 0.05
    max_fraud_ratio: 0.10
